[project]
name = "harmonic-analysis"
version = "0.10.0"
description = "Offline, sample-aligned audio features for Harmonic"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pyarrow>=20,<27"]

[project.scripts]
harmonic-analyze = "harmonic_analysis.cli:main"
harmonic-catalog = "harmonic_analysis.catalog:main"
harmonic-sam = "harmonic_analysis.sam_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmonic_analysis"]
